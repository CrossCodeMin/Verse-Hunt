<style>
/* Layout: one column command console. Header strip (name, badges, room), role-colored deck, clue log. Hunters run cobalt, the Hider runs amber. */

<script>
//#LOGIC-START
const BOOK_ROWS=`Genesis|50|Law (Pentateuch)|Moses

2 John|1|Epistles|John
3 John|1|Epistles|John

Revelation|22|Revelation|John`;
const BOOKS=BOOK_ROWS.split("\n").map((r,i)=>{const [name,ch,div,author]=r.split("|");return{name,ch:+ch,div,author,ot:i<39,i}});
const BOOK=n=>BOOKS.find(b=>b.name===n);
const DIVISIONS=["Law (Pentateuch)","History","Wisdom & Poetry","Prophets","Gospels & Acts","Epistles","Revelation"];
// Built-in fallback sample set. Text is the public-domain KJV; NKJV text can be imported by the host (it is copyrighted, so it is not bundled).
const SAMPLE=[

["Genesis",50,20,"But as for you, ye thought evil against me; but God meant it unto good, to bring to pass, as it is this day, to save much people alive."],

["Ruth",1,16,"And Ruth said, Intreat me not to leave thee, or to return from following after thee: for whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God:"],

const STOP=new Set(("i a an the and of in to is it he she they them we us you your my me was were be been for with as at by from on or but not that this which who whom so if into out up down "+
"his her him our their thou thee thy thine ye hath unto shall shalt will have has had are am do did then than there these those also yet").split(" "));
const COOLDOWN_MS=5*60*1000, WRONG_MS=10*60*1000, OFFLINE_MS=5*60*1000, ANSWER_MS=120*1000, FL_MS=5*60*1000, CHAL_MS=5*60*1000, LOCK_MS=3*60*1000, RULE_MS=60*1000;
const HAND_LIMIT=6, START_HAND=3;
class GameError extends Error{}
const GE=m=>new GameError(m);
const clone=o=>JSON.parse(JSON.stringify(o));
const refStr=v=>v.book+" "+v.ch+":"+v.v;
const normQ=s=>String(s).replace(/[‘’]/g,"'");
function tokens(text){return (normQ(text).match(/[A-Za-z0-9']+(?:-[A-Za-z0-9']+)*/g)||[])}
function wordCount(text){return normQ(text).split(/\s+/).filter(w=>/[A-Za-z0-9]/.test(w)).length}
function isEligible(w){const k=normQ(w).toLowerCase().replace(/^'+|'+$/g,"");return k.length>=2&&!STOP.has(k)&&!/^[0-9]+$/.test(k)}
function eligibleWords(text){const seen=new Set(),out=[];for(const t of tokens(text)){const k=t.toLowerCase();if(isEligible(t)&&!seen.has(k)){seen.add(k);out.push(t)}}return out}
// Default fallback word is deterministic: the longest eligible content word (first one wins a tie).
function defaultWord(text){const el=eligibleWords(text);const pool=el.length?el:tokens(text);let best="";for(const w of pool)if(w.length>best.length)best=w;return best}
function containsWord(text,w){const k=normQ(w).toLowerCase().trim();if(!k)return false;
  for(const t of tokens(text)){const l=t.toLowerCase();if(l===k)return true;if(l.includes("-")&&l.split("-").includes(k))return true}return false}
// Shuffle is used only to set the order of the Hider deck and of the False Lead choices. There are no dice or roll checks.
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function scrambleWord(w){if(w.length<3)return w;let o=w[0]+w.slice(1).split("").reverse().join("");if(o===w)o=w.slice(1)+w[0];return o}

function compute(k,S,input,scr){
  const v=S.verse,b=BOOK(v.book);
  switch(k){
   case "canon":{const ot=scr?!b.ot:b.ot;return "Target is in the "+(ot?"Old":"New")+" Testament."}
   case "division":{const i=DIVISIONS.indexOf(b.div);return "Division: "+(scr?DIVISIONS[(i+1)%DIVISIONS.length]:b.div)+"."}
   case "threshold":{const big=scr?!(b.ch>=20):b.ch>=20;return big?"The book has 20 or more chapters.":"The book has fewer than 20 chapters."}
   case "scroll":{let L=b.ch<10?"Short":b.ch<30?"Medium":"Long";if(scr)L={Short:"Medium",Medium:"Long",Long:"Medium"}[L];
     return "Scroll length: "+L+" ("+{Short:"under 10 chapters",Medium:"10 to 29 chapters",Long:"30 or more chapters"}[L]+")."}
   case "proximity":{const pb=BOOK(input);let t=tier(Math.abs(pb.i-b.i));if(scr)t=t===0?1:t===1?2:1;return pb.name+": "+TIERS[t]+"."}
   case "author":{let a=b.author;if(scr){for(let n=1;n<BOOKS.length;n++){const x=BOOKS[(b.i+n)%BOOKS.length].author;if(x!==a){a=x;break}}}return "Traditional author: "+a+"."}
   case "tally":{let n=wordCount(v.text);if(scr)n=n+1;return "The verse has "+n+" words."}
   case "term":{let yes=containsWord(v.text,input);if(scr)yes=!yes;return "“"+input+"”: "+(yes?"YES":"NO")+"."}
   case "sector":{const blocks=Math.ceil(b.ch/5);let bl=Math.ceil(v.ch/5);if(scr&&blocks>1)bl=bl>1?bl-1:bl+1;
     const a=(bl-1)*5+1,e=Math.min(bl*5,b.ch);return a===e?"Chapter "+a+".":"Chapters "+a+"–"+e+"."}
  }
}

function chalHit(S,c,ref){

function buildDeck(){let n=0;const d=[];for(const c of CARDS)for(let i=0;i<c.copies;i++)d.push({id:"c"+(++n),k:c.k});return shuffle(d)}
function drawCards(S,n){let got=0;for(let i=0;i<n;i++){if(!S.deck.length){S.deck=shuffle(S.discard);S.discard=[]}if(!S.deck.length)break;S.hand.push(S.deck.pop());got++}return got}

/* ---------- investigations: Hunters ask, the Hider answers and draws ---------- */
function guardHunter(S,now){
  if(S.status!=="playing")throw GE("The round is not active.");
  if(now<S.cooldownUntil)throw GE("Cooldown active: "+fmt(S.cooldownUntil-now)+" left.");
  if(S.pending)throw GE("An investigation is already waiting for the Hider’s answer.");
  if(S.challenge)throw GE("Clear the "+CH_LABEL[S.challenge.type]+" first.");
}
function hunterUse(S,now,k,input){
  const ab=HUNTER_ABILITIES.find(a=>a.k===k);
  guardHunter(S,now);
  const qs=qState(S,k);
  if(qs==="used")throw GE(ab.name+" was already asked this round.");
  if(qs==="blocked")throw GE(ab.name+" was blocked. Get a different question answered first, then ask it again.");
  if(ab.precision&&S.falseLead&&!S.falseLead.cleared)throw GE("Blocked by False Lead. Rule out a decoy first.");
  if(k==="proximity"&&!BOOK(input))throw GE("Choose a book first.");
  if(k==="term"){input=String(input||"").trim();if(!/^[A-Za-z']+(-[A-Za-z']+)?$/.test(normQ(input)))throw GE("Enter a single word.")}
  S.pending={k,input:input||"",expiresAt:now+ANSWER_MS};
  addLog(S,{kind:"event",tag:"meta",title:ab.name+(k==="proximity"||k==="term"?" • "+input:"")+" requested",text:"Waiting for the Hider’s answer."});
}
function answerPending(S,now,auto,word){
  const p=S.pending;if(!p)return;
  const ab=HUNTER_ABILITIES.find(a=>a.k===p.k),scr=!!S.scrambleArmed;
  let text;
  if(p.k==="extract"){
    let w=word;
    if(w){if(!eligibleWords(S.verse.text).some(x=>x.toLowerCase()===w.toLowerCase()))throw GE("That word is not eligible to send.")}
    else w=defaultWord(S.verse.text);
    text="The Hider sent the word: “"+(scr?scrambleWord(w):w)+"”."+(word?"":" (default word)");
  }else text=compute(p.k,S,p.input,scr);
  S.scrambleArmed=false;S.pending=null;S.spent=S.spent||{};S.spent[p.k]=true;S.qCount=(S.qCount||0)+1;
  addLog(S,{kind:"clue",tag:ab.tag,title:ab.name+(p.k==="proximity"||p.k==="term"?" • "+p.input:"")+(p.rerolled?" (rerolled)":""),text,scrambled:scr});
  if(!auto){const n=drawCards(S,ab.draw);addLog(S,{kind:"event",tag:"meta",vis:"hider",title:"Cards drawn",text:"You drew "+n+" card"+(n===1?"":"s")+" for answering."})}
}
function hunterGuess(S,now,book,ch,v){
  if(S.status!=="playing")throw GE("The round is not active.");
  if(now<S.cooldownUntil)throw GE("Cooldown active: "+fmt(S.cooldownUntil-now)+" left.");
  const b=BOOK(book);if(!b)throw GE("Choose a book.");
  ch=parseInt(ch,10);v=parseInt(v,10);
  if(!(ch>=1&&ch<=b.ch))throw GE(b.name+" has "+b.ch+" chapter"+(b.ch>1?"s":"")+".");
  if(!(v>=1&&v<=176))throw GE("Enter a valid verse number.");
  const t=S.verse,g=book+" "+ch+":"+v;
  if(book===t.book&&ch===t.ch&&v===t.v){S.status="ended";S.winner="hunters";S.reason="Hunters found the verse with "+g+".";addLog(S,{kind:"ok",tag:"meta",title:"Final Guess",text:g+" is correct."});return}
  if(book===t.book&&ch===t.ch){S.cooldownUntil=now+COOLDOWN_MS;addLog(S,{kind:"bad",tag:"meta",title:"Final Guess • "+g,text:"Right book and chapter, wrong verse. 5 minute cooldown."});return}
  S.cooldownUntil=now+WRONG_MS;
  const n=drawCards(S,1);
  addLog(S,{kind:"bad",tag:"meta",title:"Final Guess • "+g,text:"Wrong "+(book===t.book?"chapter":"book")+". 10 minute cooldown, and the Hider draws a card."});
  if(n)addLog(S,{kind:"event",tag:"meta",vis:"hider",title:"Cards drawn",text:"You drew 1 card from a wrong Hunter guess."});
}

/* ---------- Hider card play ---------- */
function playCard(S,now,id,opt,costIds){
  if(S.status!=="playing")throw GE("The round is not active.");
  guardHand(S);
  const card=S.hand.find(c=>c.id===id);if(!card)throw GE("That card is not in your hand.");
  const def=CARDS.find(c=>c.k===card.k);
  const cost=(costIds||[]).filter(x=>x!==id);
  if(cost.length!==def.cost)throw GE(def.name+" needs "+def.cost+" other card"+(def.cost===1?"":"s")+" marked to discard.");
  switch(card.k){
   case "fauna":case "symbol":case "era":{
     if(S.challenge)throw GE("A challenge is already active.");
     if(!opt||!CH_POOL[card.k][opt])throw GE("Pick an option first.");
     S.challenge={type:card.k,choice:opt,expiresAt:now+CHAL_MS};
     addLog(S,{kind:"event",tag:"meta",title:def.name+" • "+opt,text:CH_ASK[card.k]+" Investigations are paused until it is cleared (5 minutes at most)."});break}
   case "override":{
     if(!S.pending)throw GE("No investigation is waiting.");
     const ab=HUNTER_ABILITIES.find(a=>a.k===S.pending.k);S.blocked=S.blocked||{};S.blocked[ab.k]=S.qCount||0;S.pending=null;
     addLog(S,{kind:"bad",tag:"meta",title:"Inquiry Override",text:ab.name+" was blocked. Hunters can ask it again after another question is answered."});break}
   case "reroll":{
     if(!S.pending)throw GE("No investigation is waiting.");
     if(!rerollOptions(S.pending.k,S).includes(opt))throw GE("Pick a replacement investigation.");
     S.blocked=S.blocked||{};S.blocked[S.pending.k]=S.qCount||0;S.pending.k=opt;S.pending.input="";S.pending.rerolled=true;
     addLog(S,{kind:"event",tag:"meta",title:"Scan Reroll",text:"The Hider swapped the investigation for another from the same tier."});break}
   case "scramble":{
     if(S.scrambleArmed)throw GE("Signal Scramble is already armed.");
     S.scrambleArmed=true;addLog(S,{kind:"event",tag:"meta",vis:"hider",title:"Signal Scramble armed",text:"The next scan result will be corrupted."});break}
   case "offline":{
     if(now<S.offlineUntil)throw GE("Offline Protocol is already active.");
     S.offlineUntil=now+OFFLINE_MS;addLog(S,{kind:"event",tag:"meta",title:"Offline Protocol",text:"Hunters must put their Bibles away for 5 minutes."});break}
   case "falselead":{
     if(S.falseLead&&!S.falseLead.cleared)throw GE("A False Lead is already active.");
     S.falseLead={pending:true,expiresAt:now+FL_MS,decoys:[],options:[],cleared:false};
     addLog(S,{kind:"event",tag:"meta",title:"False Lead incoming",text:"The Hider is choosing decoys. Term Sweep and Sector Lock are blocked."});break}
   case "shift":{
     if(S.shifted>=1)throw GE("Position Shift is once per round.");
     if(!opt||!opt.book)throw GE("Choose the new verse first.");
     if(opt.ch===S.verse.ch&&opt.v===S.verse.v)throw GE("Choose a different verse.");
     S.verse=opt;S.shifted=1;S.falseLead=null;
     S.log.forEach(e=>{if(e.tag==="chapter"||e.tag==="verse")e.stale=true});
     addLog(S,{kind:"event",tag:"meta",title:"Hider shifted position",text:"Same book, new verse. Chapter and verse clues are voided."});break}
  }
  discardCards(S,[id,...cost]);
}
function normalize(S,now){
  if(S.status!=="playing")return;
  if(S.endsAt&&now>=S.endsAt){S.status="ended";S.winner="hider";S.reason="Time ran out before the Hunters found the verse.";addLog(S,{kind:"event",tag:"meta",title:"Time up",text:S.reason});return}
  if(S.pending&&now>=S.pending.expiresAt)answerPending(S,now,true);
  if(S.challenge&&now>=S.challenge.expiresAt){addLog(S,{kind:"event",tag:"meta",title:CH_LABEL[S.challenge.type]+" expired",text:"Investigations are open again."});S.challenge=null}
  if(S.falseLead&&S.falseLead.pending&&now>=S.falseLead.expiresAt)finalizeFalseLead(S,[],true);
}
function newRoom(code,hostId,name,role){
  return{code,rev:1,status:"lobby",hostId,translation:"NKJV",nkjv:{},players:{[hostId]:{name,role}},verse:null,
    handLimit:HAND_LIMIT,hand:[],deck:[],discard:[],pending:null,challenge:null,abilityLock:{},spent:{},blocked:{},qCount:0,ruleLock:0,endsAt:0,
    cooldownUntil:0,offlineUntil:0,scrambleArmed:false,shifted:0,falseLead:null,log:[],winner:null,reason:""}

function textFor(S,book,ch,v){const k=book+"|"+ch+"|"+v;if(S.translation==="NKJV"&&S.nkjv&&S.nkjv[k])return{text:S.nkjv[k],src:"NKJV"};
  const s=SAMPLE.find(x=>x.book===book&&x.ch===ch&&x.v===v);return s?{text:s.text,src:"KJV"}:null}
function autoDecoys(S){
  const t=S.verse,tb=BOOK(t.book);
  const others=SAMPLE.filter(s=>!(s.book===t.book&&s.ch===t.ch&&s.v===t.v));
  const score=s=>s.book===t.book?0:BOOK(s.book).ot===tb.ot?1:2;
  return others.map((s,i)=>({s,i})).sort((a,b)=>score(a.s)-score(b.s)||a.i-b.i).slice(0,2).map(x=>({book:x.s.book,ch:x.s.ch,v:x.s.v}));
}
function finalizeFalseLead(S,typed,auto){
  const same=(x,y)=>x.book===y.book&&x.ch===y.ch&&x.v===y.v;

  if(d.length<2)d=d.concat(autoDecoys(S).filter(x=>!d.some(y=>same(x,y)))).slice(0,2);
  const real={book:S.verse.book,ch:S.verse.ch,v:S.verse.v};
  S.falseLead={pending:false,decoys:d,options:shuffle([real,...d]),cleared:false};
  addLog(S,{kind:"event",tag:"meta",title:"False Lead",text:"Three candidate verses arrived: "+S.falseLead.options.map(refStr).join(", ")+". Rule out a decoy to unlock Term Sweep and Sector Lock."+(auto?" (decoys auto-selected)":"")});
}
/* ---------- solo mode: the Computer plays the Hider ---------- */
function soloStart(S,now){
  const pool=SAMPLE.filter(x=>!(S.verse&&x.book===S.verse.book&&x.ch===S.verse.ch&&x.v===S.verse.v));
  const x=pool[Math.floor(Math.random()*pool.length)],t=textFor(S,x.book,x.ch,x.v);
  Object.assign(S,{verse:{book:x.book,ch:x.ch,v:x.v,text:t.text,src:t.src},status:"playing",hand:[],deck:buildDeck(),discard:[],handLimit:HAND_LIMIT,pending:null,challenge:null,abilityLock:{},spent:{},blocked:{},qCount:0,ruleLock:0,endsAt:now+45*60000,cooldownUntil:0,offlineUntil:0,scrambleArmed:false,shifted:0,falseLead:null,log:[],winner:null,reason:"",botNext:now+30000});
  drawCards(S,START_HAND);

// One bot action per call. Returns true if it changed anything.
function botStep(S,now){
  if(!S.solo||S.status!=="playing")return false;
  try{
    const need=needDiscard(S);
    if(need>0){discardCards(S,S.hand.slice(0,need).map(c=>c.id));return true}
    if(S.falseLead&&S.falseLead.pending){finalizeFalseLead(S,[],true);return true}
    const has=k=>S.hand.find(c=>c.k===k);
    const spare=(id,n)=>{const o=S.hand.filter(c=>c.id!==id).slice(0,n).map(c=>c.id);return o.length===n?o:null};
    const p=S.pending;
    if(p){
      if(now-(p.expiresAt-ANSWER_MS)<1500)return false;
      const ab=HUNTER_ABILITIES.find(a=>a.k===p.k);
      const ov=has("override");
      if(ov&&ab.precision){const c=spare(ov.id,1);if(c){playCard(S,now,ov.id,null,c);return true}}
      const sc=has("scramble");

  }catch(e){if(!(e instanceof GameError))console.error(e)}

const mem={};let bc=null;try{bc=new BroadcastChannel("verse-hunt")}catch(e){}
const Net={
  ready:null,
  init(){this.ready=(async()=>{
    try{
      // firebase-config.js may declare `const firebaseConfig = {...}` (a global lexical binding, not a window property), so read it by name.
      let cfg=null;
      try{if(typeof firebaseConfig!=="undefined")cfg=firebaseConfig}catch(e){}
      cfg=cfg||window.VERSE_HUNT_FIREBASE||window.firebaseConfig||window.FIREBASE_CONFIG||null;
      if(cfg&&!cfg.databaseURL)cfg=Object.assign({},cfg,{databaseURL:"https://verse-hunter-241ca-default-rtdb.firebaseio.com"});
      if(cfg&&cfg.apiKey&&cfg.databaseURL&&!/YOUR_/.test(cfg.apiKey+cfg.databaseURL)&&window.firebase){
        if(!firebase.apps.length)firebase.initializeApp(cfg);A.fdb=firebase.database();A.mode="cloud";
        A.fdb.ref(".info/connected").on("value",s=>{A.sync=s.val()?"live":"connecting";render()});
      }
    }catch(e){console.error(e)}
    render()})();return this.ready},
  lkey:c=>"vh.room."+c,
  fix(S){if(!S)return null;["log","hand","deck","discard"].forEach(k=>{S[k]=S[k]||[]});S.nkjv=S.nkjv||{};S.players=S.players||{};S.abilityLock=S.abilityLock||{};S.spent=S.spent||{};S.blocked=S.blocked||{};
    S.pending=S.pending||null;S.challenge=S.challenge||null;S.falseLead=S.falseLead||null;S.handLimit=S.handLimit||HAND_LIMIT;
    if(S.falseLead){S.falseLead.decoys=S.falseLead.decoys||[];S.falseLead.options=S.falseLead.options||[]}return S},
  async get(code){
    if(A.mode==="cloud"){const s=await A.fdb.ref("rooms/"+code).once("value");return this.fix(s.val())}
    try{const r=localStorage.getItem(this.lkey(code));if(r)return JSON.parse(r)}catch(e){}
    return mem[code]?clone(mem[code]):null;
  },
  async put(S){
    if(A.mode==="cloud"){await A.fdb.ref("rooms/"+S.code).set(clone(S));return}
    mem[S.code]=clone(S);try{localStorage.setItem(this.lkey(S.code),JSON.stringify(S))}catch(e){}
    try{bc&&bc.postMessage({code:S.code})}catch(e){}
  },
  sub(code,cb){
    this.unsubscribe();
    if(A.mode==="cloud"){
      const ref=A.fdb.ref("rooms/"+code);
      const h=ref.on("value",s=>cb(Net.fix(s.val())),e=>{A.sync="error";toast("Lost the room connection.");render()});
      A.unsub=()=>ref.off("value",h);
    }else{
      A.sync="local";

      const bch=ev=>h(ev.data),st=ev=>{if(ev.key===Net.lkey(code))h({code})};
      bc&&bc.addEventListener("message",bch);window.addEventListener("storage",st);
      A.unsub=()=>{bc&&bc.removeEventListener("message",bch);window.removeEventListener("storage",st)};
      h({code});
    }
  },
  unsubscribe(){if(A.unsub){try{A.unsub()}catch(e){}A.unsub=null}}
};

      const res=await fetch("https://bible-api.com/"+encodeURIComponent(r.book+" "+r.ch+":"+r.v)+"?translation=kjv");
      if(!res.ok)throw new Error("not found");
      const j=await res.json();const t=String(j.text||"").replace(/\s+/g," ").trim();
      if(!t)throw new Error("empty");
      A.drafts[p+"-ct"]=t;A.drafts[p+"-src"]="KJV";
    }catch(e){toast("Could not fetch that verse. Check the reference or type the text.")}
    A.flags["f"+p]=false;render();
  },
  "send-word"(b){const w=b.dataset.w;act((S,now)=>{guardHand(S);answerPending(S,now,false,w)})},
  "send-default"(){act((S,now)=>{guardHand(S);answerPending(S,now,false,null)})},
  "h-answer"(){act((S,now)=>{guardHand(S);if(!S.pending)return;if(S.pending.k==="extract")throw GE("Tap a highlighted word to send it, or send the default word.");answerPending(S,now,false)})},
  "h-play"(b){const id=b.dataset.id,S0=A.S,c=S0.hand.find(x=>x.id===id);if(!c)return;
    if(["fauna","symbol","era","reroll"].includes(c.k)&&!b.dataset.go){A.choice={card:id};render();return}
    const sel=A.flags.dsel||{};const cost=Object.keys(sel).filter(x=>sel[x]&&x!==id&&S0.hand.some(h=>h.id===x));
    let opt=dv("ch-"+id);
    if(c.k==="shift"){try{opt=readPick("sh",S0.verse.book)}catch(e){toast(e.message);return}}
    act((S,now)=>{playCard(S,now,id,opt,cost);A.choice=null;A.flags.dsel={};if(c.k==="shift"){["sh-cc","sh-cv","sh-ct","sh-src"].forEach(k=>delete A.drafts[k])}})},
  "h-discard"(){act(S=>{const n=needDiscard(S);if(n<=0)return;const sel=A.flags.dsel||{};const ids=S.hand.filter(c=>sel[c.id]).map(c=>c.id);
    if(ids.length!==n)throw GE("Mark exactly "+n+" card"+(n>1?"s":"")+" to discard.");discardCards(S,ids);A.flags.dsel={}})},
  "fl-send"(){const raw=[1,2].map(n=>(dv("fl-d"+n)||"").trim()).filter(Boolean);const typed=raw.map(parseRef);
    if(typed.some(x=>!x)){toast("Write decoys like \u201cJohn 3:16\u201d.");return}
    act(S=>{if(!S.falseLead||!S.falseLead.pending)return;finalizeFalseLead(S,typed,false)})},
  "fl-auto"(){act(S=>{if(!S.falseLead||!S.falseLead.pending)return;finalizeFalseLead(S,[],true)})}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="close-modal-bg"&&e.target!==b)return;
  const f=H[b.dataset.act==="close-modal-bg"?"close-modal":b.dataset.act];if(f)f(b)});

/* ---------- clock ---------- */
setInterval(()=>{
  const now=Date.now();
  document.querySelectorAll("[data-cd]").forEach(el=>{el.textContent=fmt(+el.dataset.cd-now)});
  const S=A.S;if(!S||S.status!=="playing")return;
  const r=myRole();
  if(S.solo&&!A.flags.bot){const T=clone(S);if(botStep(T,now)){A.flags.bot=true;act((S2,n2)=>{botStep(S2,n2)}).then(()=>{A.flags.bot=false})}}
  const dl=[S.endsAt,S.pending&&S.pending.expiresAt,S.challenge&&S.challenge.expiresAt,S.falseLead&&S.falseLead.pending&&S.falseLead.expiresAt].filter(Boolean);
  if(dl.length){const late=now-Math.min(...dl);if((r==="hider"&&late>=0||r==="hunter"&&late>=4000)&&!A.flags.resolving){A.flags.resolving=true;act(()=>{}).then(()=>{A.flags.resolving=false})}}
  if(S.cooldownUntil&&S.cooldownUntil<=now&&S.cooldownUntil>now-1100)render();
  if(S.offlineUntil&&S.offlineUntil>now-1100&&S.offlineUntil<=now)render();
},1000);

/* ---------- boot ---------- */
(function boot(){
  try{applyTheme(localStorage.getItem("vh.theme")||"auto")}catch(e){}
  try{const m=(location.hash.match(/room-([A-Za-z]{4})/)||location.search.match(/room=([A-Za-z]{4})/));if(m)A.drafts["j-code"]=m[1].toUpperCase()}catch(e){}
  render();
  Net.init().then(async()=>{
    const c=A.drafts["j-code"];
    try{const last=localStorage.getItem("vh.last");if(!c&&last){const S=await Net.get(last);if(S&&S.players[A.me]){A.S=S;A.code=last;Net.sub(last,onRemote);render()}}}catch(e){}
  });
})();
setInterval(()=>{try{if(A.code)localStorage.setItem("vh.last",A.code);else localStorage.removeItem("vh.last")}catch(e){}},2000);
</script>
